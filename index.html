<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5f2">
  <title>Мои задачи — Todo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .task-enter { animation: enter .22s ease-out both; }
    @keyframes enter { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    input[type="checkbox"] { accent-color: #4f46e5; }
  </style>
</head>
<body class="min-h-screen bg-[#f7f5f2] text-slate-900 selection:bg-indigo-100">
  <main class="mx-auto max-w-3xl px-5 py-12 sm:px-8 sm:py-20">
    <header class="mb-9 flex items-start justify-between gap-4">
      <div>
        <div class="mb-3 inline-flex items-center gap-2 rounded-full border border-indigo-100 bg-white/80 px-3 py-1.5 text-xs font-semibold uppercase tracking-[.16em] text-indigo-600 shadow-sm">
          <span class="h-1.5 w-1.5 rounded-full bg-indigo-500"></span> План на сегодня
        </div>
        <h1 class="text-4xl font-bold tracking-tight sm:text-5xl">Мои задачи<span class="text-indigo-600">.</span></h1>
        <p class="mt-3 max-w-md text-sm leading-6 text-slate-500 sm:text-base">Небольшой список помогает освободить место для важного.</p>
      </div>
      <div class="hidden h-14 w-14 items-center justify-center rounded-2xl bg-indigo-600 text-white shadow-lg shadow-indigo-200 sm:flex" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" class="h-7 w-7" stroke="currentColor" stroke-width="1.8"><path d="M8 5h11M8 12h11M8 19h11M4 5h.01M4 12h.01M4 19h.01" stroke-linecap="round"/></svg>
      </div>
    </header>

    <section class="overflow-hidden rounded-3xl border border-slate-200/80 bg-white shadow-[0_20px_70px_-35px_rgba(15,23,42,.25)]">
      <form id="task-form" class="flex gap-3 border-b border-slate-100 p-4 sm:p-6">
        <label for="task-input" class="sr-only">Новая задача</label>
        <input id="task-input" type="text" maxlength="120" autocomplete="off" placeholder="Добавить задачу..." class="min-w-0 flex-1 rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm outline-none transition placeholder:text-slate-400 focus:border-indigo-400 focus:bg-white focus:ring-4 focus:ring-indigo-50">
        <button type="submit" class="inline-flex shrink-0 items-center gap-2 rounded-xl bg-indigo-600 px-4 py-3 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-700 focus:outline-none focus:ring-4 focus:ring-indigo-100 active:scale-[.98]">
          <svg viewBox="0 0 20 20" fill="none" class="h-4 w-4" stroke="currentColor" stroke-width="2"><path d="M10 4v12M4 10h12" stroke-linecap="round"/></svg><span class="hidden sm:inline">Добавить</span>
        </button>
      </form>

      <div class="flex flex-wrap items-center justify-between gap-3 px-4 pb-3 pt-4 sm:px-6">
        <div class="flex items-center gap-1 rounded-xl bg-slate-100 p-1" role="group" aria-label="Фильтр задач">
          <button type="button" data-filter="all" class="filter-btn rounded-lg px-3 py-1.5 text-xs font-semibold transition">Все</button>
          <button type="button" data-filter="active" class="filter-btn rounded-lg px-3 py-1.5 text-xs font-semibold transition">Активные</button>
          <button type="button" data-filter="completed" class="filter-btn rounded-lg px-3 py-1.5 text-xs font-semibold transition">Готовые</button>
        </div>
        <button id="clear-completed" type="button" class="text-xs font-medium text-slate-400 transition hover:text-rose-600">Очистить готовые</button>
      </div>

      <ul id="task-list" class="space-y-2 px-4 pb-4 sm:px-6 sm:pb-6" aria-live="polite"></ul>
      <div id="empty-state" class="hidden px-6 pb-9 pt-5 text-center">
        <div class="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-2xl bg-slate-100 text-slate-400">
          <svg viewBox="0 0 24 24" fill="none" class="h-6 w-6" stroke="currentColor" stroke-width="1.7"><path d="M8 12h8M12 8v8" stroke-linecap="round"/><circle cx="12" cy="12" r="9"/></svg>
        </div>
        <p id="empty-title" class="text-sm font-semibold text-slate-700">Пока нет задач</p>
        <p id="empty-copy" class="mt-1 text-xs text-slate-400">Добавь первую задачу выше.</p>
      </div>

      <footer class="flex items-center justify-between border-t border-slate-100 bg-slate-50/70 px-4 py-4 text-xs text-slate-400 sm:px-6">
        <span id="remaining-count">0 задач осталось</span>
        <span class="inline-flex items-center gap-1.5"><span class="h-1.5 w-1.5 rounded-full bg-emerald-400"></span> Список сохраняется в этом браузере</span>
      </footer>
    </section>
    <p class="mt-5 text-center text-xs text-slate-400">Просто добавь задачу — и двигайся шаг за шагом.</p>
  </main>

  <script>
    const STORAGE_KEY = "simple-todo-list-v1";
    const starterTasks = [
      { id: 1, text: "Составить план на день", done: true },
      { id: 2, text: "Добавить первую задачу", done: false },
      { id: 3, text: "Сделать небольшой перерыв", done: false }
    ];
    let tasks = starterTasks;
    let filter = "all";
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) tasks = JSON.parse(saved);
    } catch (_) {}

    const list = document.getElementById("task-list");
    const form = document.getElementById("task-form");
    const input = document.getElementById("task-input");
    const empty = document.getElementById("empty-state");
    const emptyTitle = document.getElementById("empty-title");
    const emptyCopy = document.getElementById("empty-copy");

    function save() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); } catch (_) {}
    }
    function render() {
      list.replaceChildren();
      const visible = tasks.filter(task => filter === "all" || (filter === "active" ? !task.done : task.done));
      visible.forEach(task => {
        const item = document.createElement("li");
        item.className = "task-enter group flex items-center gap-3 rounded-2xl border border-slate-100 bg-white px-3 py-3 transition hover:border-slate-200 hover:bg-slate-50/70 sm:px-4";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.done;
        checkbox.setAttribute("aria-label", task.done ? "Отметить как активную" : "Отметить как выполненную");
        checkbox.className = "h-5 w-5 shrink-0 cursor-pointer rounded-md border-slate-300";
        checkbox.addEventListener("change", () => {
          task.done = checkbox.checked;
          save(); render();
        });

        const text = document.createElement("span");
        text.textContent = task.text;
        text.className = "min-w-0 flex-1 break-words text-sm " + (task.done ? "text-slate-400 line-through" : "font-medium text-slate-700");

        const remove = document.createElement("button");
        remove.type = "button";
        remove.setAttribute("aria-label", "Удалить задачу: " + task.text);
        remove.className = "flex h-8 w-8 shrink-0 items-center justify-center rounded-lg text-slate-300 opacity-100 transition hover:bg-rose-50 hover:text-rose-500 sm:opacity-0 sm:group-hover:opacity-100 sm:focus:opacity-100";
        remove.innerHTML = '<svg viewBox="0 0 20 20" fill="none" class="h-4 w-4" stroke="currentColor" stroke-width="1.7"><path d="M4 6h12M8 6V4h4v2m-6 0 1 10h6l1-10M9 9v4m2-4v4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        remove.addEventListener("click", () => {
          tasks = tasks.filter(item => item.id !== task.id);
          save(); render();
        });

        item.append(checkbox, text, remove);
        list.append(item);
      });

      const remaining = tasks.filter(task => !task.done).length;
      document.getElementById("remaining-count").textContent = remaining + (remaining === 1 ? " задача осталась" : remaining >= 2 && remaining <= 4 ? " задачи осталось" : " задач осталось");
      empty.classList.toggle("hidden", visible.length !== 0);
      if (visible.length === 0) {
        if (tasks.length === 0) {
          emptyTitle.textContent = "Пока нет задач";
          emptyCopy.textContent = "Добавь первую задачу выше.";
        } else {
          emptyTitle.textContent = "Здесь пока пусто";
          emptyCopy.textContent = filter === "active" ? "Все задачи уже выполнены." : "Нет выполненных задач.";
        }
      }
      document.querySelectorAll(".filter-btn").forEach(button => {
        const selected = button.dataset.filter === filter;
        button.className = "filter-btn rounded-lg px-3 py-1.5 text-xs font-semibold transition " + (selected ? "bg-white text-indigo-700 shadow-sm" : "text-slate-500 hover:text-slate-800");
        button.setAttribute("aria-pressed", String(selected));
      });
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) { input.focus(); return; }
      tasks.unshift({ id: Date.now(), text, done: false });
      input.value = "";
      filter = "all";
      save(); render(); input.focus();
    });
    document.querySelectorAll(".filter-btn").forEach(button => {
      button.addEventListener("click", () => { filter = button.dataset.filter; render(); });
    });
    document.getElementById("clear-completed").addEventListener("click", () => {
      tasks = tasks.filter(task => !task.done);
      save(); render();
    });
    render();
  </script>
</body>
</html>
